[project]
name = "refdata"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Matperson", email = "ry5yq.plod094@passmail.net" }
]
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
]

[project.scripts]
refdata = "refdata:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "sqlfluff>=4.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
"unit: tests rapides sans réseau ni base",
"integration: tests avec la base PostgreSQL",
]
addopts = "-ra --strict-markers"
